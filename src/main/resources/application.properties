# ============================================================
# Zelatan Cell - Konfigurasi Utama Backend (Spring Boot + PostgreSQL Supabase)
# ============================================================

# Memuat kredensial dari file .env di root proyek backend
spring.config.import=optional:file:./.env[.properties]

# --- Database PostgreSQL (Supabase Session Pooler) ---
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:5432/postgres?sslmode=require
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
# Keep the pool warm: opening a new pooled connection costs a TLS + SCRAM handshake
# (0.25 s to Singapore, 3 s to Sydney), so idle connections are kept and pinged instead.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.open-in-view=true
# Load related rows (provider, category, user, product) in batches with IN (...) instead of
# one query per row (N+1). Every query is a network round trip to Supabase.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:INFO}

# Multipart File Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Default Admin Credentials
app.admin.username=${ADMIN_USERNAME:Hanif18}
app.admin.password=${ADMIN_PASSWORD}

# --- Xendit Payment Gateway (SKPL-F05) ---
xendit.api-key=${XENDIT_API_KEY:}
xendit.base-url=${XENDIT_BASE_URL:https://api.xendit.co}
xendit.callback-token=${XENDIT_CALLBACK_TOKEN:}
xendit.invoice-duration-seconds=86400
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${APP_URL:http://localhost:5173}

# --- Email SMTP (SKPL-F18) ---
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:${SPRING_MAIL_USERNAME:}}
spring.mail.password=${MAIL_APP_PASSWORD:${SPRING_MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_USERNAME:${SPRING_MAIL_USERNAME:noreply@zelatancell.local}}
app.mail.enabled=${MAIL_ENABLED:true}

# --- Google OAuth2 (SKPL-F03) ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# --- OpenRouter AI chat admin (SKPL-F20) ---
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.model=${OPENROUTER_MODEL:}
openrouter.fallback-models=${OPENROUTER_FALLBACK_MODELS:}
