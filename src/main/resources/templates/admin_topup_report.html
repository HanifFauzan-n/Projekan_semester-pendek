<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Monitoring Top Up - FlashCell Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        @media print {

            .no-print,
            .navbar,
            .footer,
            .btn {
                display: none !important;
            }

            .card {
                border: none !important;
                box-shadow: none !important;
            }

            body {
                background-color: white !important;
            }
        }
    </style>
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top no-print">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/home-admin}">FlashCell [Admin]</a>
            <div class="d-flex">
                <a th:href="@{/profile-admin}" class="btn btn-outline-light btn-sm">
                    <i class="fas fa-arrow-left me-1"></i> Back to Profile
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-primary"><i class="fas fa-desktop me-2"></i>Monitoring Top Up</h3>

            <div class="no-print">
                <a th:href="@{/admin/topups}" class="btn btn-outline-secondary me-2">
                    <i class="fas fa-sync-alt"></i> Refresh
                </a>
                <button onclick="window.print()" class="btn btn-success">
                    <i class="fas fa-print me-2"></i> Cetak PDF
                </button>
            </div>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show no-print" role="alert">
            <i class="fas fa-check-circle me-2"></i><span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show no-print" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i><span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Waktu Request</th>
                                <th>User Info</th>
                                <th>Nominal</th>
                                <th class="text-center">Status</th>
                                <th class="text-center no-print">Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="topup : ${topups}">
                                <td class="ps-4 text-muted fw-bold" th:text="'#' + ${topup.id}">1</td>

                                <td th:text="${#temporals.format(topup.date, 'dd MMM yyyy, HH:mm:ss')}">
                                    15 Jan 2026, 12:00
                                </td>

                                <td>
                                    <div class="fw-bold text-dark" th:text="${topup.user.username}">Username</div>
                                    <small class="text-muted">
                                        <i class="fas fa-phone-alt me-1"></i>
                                        <span th:text="${topup.user.phoneNumber}">08123456789</span>
                                    </small>
                                </td>

                                <td class="fw-bold text-primary"
                                    th:text="'+ Rp ' + ${#numbers.formatDecimal(topup.amount, 0, 'POINT', 0, 'COMMA')}">
                                    + Rp 50.000
                                </td>

                                <td class="text-center">
                                    <span th:if="${topup.status.name() == 'SUCCESS'}"
                                        class="badge bg-success rounded-pill">
                                        <i class="fas fa-check me-1"></i> SUCCESS
                                    </span>
                                    <span th:if="${topup.status.name() == 'PENDING'}"
                                        class="badge bg-warning text-dark rounded-pill">
                                        <i class="fas fa-clock me-1"></i> PENDING
                                    </span>
                                    <span th:if="${topup.status.name() == 'FAILED'}"
                                        class="badge bg-danger rounded-pill">
                                        <i class="fas fa-times me-1"></i> FAILED
                                    </span>
                                </td>

                                <td class="text-center no-print">
                                    <form th:if="${topup.status.name() == 'PENDING'}"
                                        th:action="@{/admin/topups/cancel}" method="post"
                                        onsubmit="return confirm('Yakin ingin membatalkan Top Up ini?');">

                                        <input type="hidden" name="id" th:value="${topup.id}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="fas fa-ban me-1"></i> Batal
                                        </button>
                                    </form>

                                    <span th:unless="${topup.status.name() == 'PENDING'}" class="text-muted">-</span>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(topups)}">
                                <td colspan="6" class="text-center py-5 text-muted">
                                    <i class="fas fa-search-dollar fa-3x mb-3 text-secondary"></i><br>
                                    Belum ada riwayat Top Up.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Refresh halaman otomatis setiap 15 detik (15000 milidetik)
        setTimeout(function () {
            window.location.reload(1);
        }, 15000);
    </script>
</body>

</html>
