<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - FlashCell</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-brand">
            <div class="card auth-card">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">Reset Password</h2>
                    
                    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}">
                    </div>
                    
                    <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}">
                    </div>

                    <form th:action="@{/forgot-password}" method="post">

                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username"
                                placeholder="Enter your username" required>
                        </div>

                        <div class="mb-3">
                            <label for="recoveryKey" class="form-label">Recovery Key</label>
                            <input type="text" class="form-control" id="recoveryKey" name="recoveryKey"
                                placeholder="Enter your registered Recovery Key" required>
                        </div>

                        <div class="mb-3">
                            <label for="newPassword" class="form-label">New Password</label>
                            <input type="password" class="form-control" id="newPassword" name="newPassword"
                                placeholder="Minimum 8 characters" required>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary">Update Password</button>
                        </div>

                    </form>
                </div>

                <div class="auth-footer text-center">
                    Remember your password? <a th:href="@{/login}">Login here</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
