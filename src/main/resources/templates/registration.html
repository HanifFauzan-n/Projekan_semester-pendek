<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Register - Zelatan Cell</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Zelatan Cell</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-brand">
            <div class="card auth-card">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">Create a New Account</h2>
                    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}">
                    </div>

                    <form th:action="@{/register}" th:object="${userRequest}" method="post">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" th:field="*{username}"
                                    placeholder="Min. 8 characters" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" th:field="*{password}"
                                    placeholder="Min. 8 characters" required>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmPassword"
                                    th:field="*{confirmPassword}" placeholder="Re-enter your password" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Recovery Key</label>
                                <input type="text" id="recoveryKey" th:field="*{recoveryKey}" class="form-control"
                                    placeholder="Enter a unique number to reset your password" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="mb-3">
                                <label for="phoneNumber" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="phoneNumber" th:field="*{phoneNumber}"
                                    placeholder="Enter your active phone number" required>
                            </div>
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary">Register</button>
                        </div>
                    </form>
                </div>
                <div class="auth-footer text-center">
                    Already have an account? <a th:href="@{/login}">Login here</a>
                </div>
            </div>
        </div>
</body>

</html>
